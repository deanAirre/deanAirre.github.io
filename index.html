<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer's Notes</title>
  <link rel="stylesheet" href="style.css">
  <script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
  <button id="theme" aria-label="Toggle dark mode"> Dark || Light </button>
  <header class="hero">
    <h1>Developer's Notes</h1>
    <input id="q" type="search" placeholder="Search..." aria-label="Search">
  </header>

  <main class="feed">
    <a class="card" href="notes/">
      <small>Notes · 2 days ago</small>
      <h2>Card title</h2>
      <p>Short description of the thing this card links to.</p>
    </a>
    <a class="card" href="links/">
      <small>Links</small>
      <h2>Another card</h2>
      <p>Another short description.</p>
    </a>
    <!-- copy the <a class="card"> block for more -->
  </main>

  <script>
    const q = document.getElementById('q');
    q.addEventListener('input', () => {
      const t = q.value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        c.hidden = !c.textContent.toLowerCase().includes(t);
      });
    });
    const btn = document.getElementById('theme');
    const label = () => btn.textContent =
      document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
    label();
    btn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      label();
    });
    
  </script>
</body>
</html>
