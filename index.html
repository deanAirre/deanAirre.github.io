<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Developer's Notes</title>
  <link rel="stylesheet" href="style.css">
  <script>
  document.documentElement.dataset.theme =
    localStorage.getItem('theme') ||
    (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
</script>
</head>
<body>
  <button id="theme" aria-label="Toggle dark mode"> Dark || Light </button>
  <header class="hero">
    <h1>Developer's Notes</h1>
    <input id="q" type="search" placeholder="Search..." aria-label="Search">
  </header>

  <main class="feed">
      <a class="card" href="notes/">
        <div class="thumb">
          <img src="img/ibm.jpg" alt="">
        </div>
        <div class="text">
          <small>Notes · 2 days ago</small>
          <h2>Larpers Notes</h2>
          <p>This is where I larp the most</p>
        </div>
      </a>
      <a class="card" href="about/">
        <div class="thumb">
          <img src="img/ibm.jpg" alt="">
        </div>
        <div class="text">
          <small>About · 7 days ago</small>
          <h2>About</h2>
          <p>About this site I made to larp</p>
        </div>
      </a>
    <!-- copy the <a class="card"> block for more -->
  </main>

  <script>
    const q = document.getElementById('q');
    q.addEventListener('input', () => {
      const t = q.value.toLowerCase();
      document.querySelectorAll('.card').forEach(c => {
        c.hidden = !c.textContent.toLowerCase().includes(t);
      });
    });
    const btn = document.getElementById('theme');
    const label = () => btn.textContent =
      document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
    label();
    btn.addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      label();
    });
    
  </script>
</body>
</html>
